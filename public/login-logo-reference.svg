<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 155" role="img" aria-labelledby="title">
  <title id="title">Grupo Canaima ScanControl</title>
  <defs>
    <linearGradient id="whiteC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8ed"/>
    </linearGradient>
    <linearGradient id="limeC" x1="0" y1="0" x2="1" y2="1">
