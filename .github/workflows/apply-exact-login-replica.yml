name: Apply exact approved login replica
on:
  push:
    paths:
      - '.github/workflows/apply-exact-login-replica.yml'
permissions:
  contents: write
jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace login with approved replica
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()
          # Add icons used by the approved login without touching scanner logic.
          s=s.replace('LogOut, Mail, Menu, PackageSearch', 'LogOut, Mail, Menu, PackageSearch, Eye, EyeOff')
          new_login=r'''function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [showPassword, setShowPassword] = useState(false);
  const [remember, setRemember] = useState(true);
  const [formMessage, setFormMessage] = useState<{ kind: "error" | "success"; text: string } | null>(null);

  useEffect(()=>{
    try {
      const saved=window.localStorage.getItem("scancontrol-login-email");
      if(saved)setEmail(saved);
    } catch {}
  },[]);

  async function submit(event: FormEvent) {
    event.preventDefault();
    setBusy(true);
    setFormMessage(null);
    try {
      const normalizedEmail=email.trim();
      if(remember){ try{window.localStorage.setItem("scancontrol-login-email", normalizedEmail);}catch{} }
      else { try{window.localStorage.removeItem("scancontrol-login-email");}catch{} }
      const { data, error } = await supabase.auth.signInWithPassword({ email: normalizedEmail, password });
      if (error) {
        const text = error.code === "email_not_confirmed"
          ? "Debes confirmar primero el enlace enviado a tu correo."
          : error.code === "invalid_credentials"
            ? "El correo o la contraseña no son correctos."
            : "No se pudo iniciar sesión. Intenta nuevamente.";
        setFormMessage({ kind: "error", text });
        toast.error("No se pudo iniciar sesión", { description: text });
        return;
      }
      if (!data.session) {
        setFormMessage({ kind: "error", text: "No se recibió una sesión válida. Intenta nuevamente." });
        return;
      }
      setFormMessage({ kind: "success", text: "Acceso correcto. Cargando tu perfil…" });
    } catch {
      const text = "No fue posible conectar con el servicio. Revisa tu conexión e intenta nuevamente.";
      setFormMessage({ kind: "error", text });
      toast.error("Error de conexión", { description: text });
    } finally {
      setBusy(false);
    }
  }

  async function recoverPassword(){
    const normalizedEmail=email.trim();
    if(!normalizedEmail){
      const text="Escribe tu correo electrónico para enviarte el enlace de recuperación.";
      setFormMessage({kind:"error",text});
      return;
    }
    const {error}=await supabase.auth.resetPasswordForEmail(normalizedEmail,{redirectTo:window.location.origin});
    if(error){
      const text="No se pudo enviar el correo de recuperación. Intenta nuevamente.";
      setFormMessage({kind:"error",text});
      toast.error("No se pudo enviar el enlace");
      return;
    }
    const text="Revisa tu correo. Te enviamos un enlace para restablecer tu contraseña.";
    setFormMessage({kind:"success",text});
    toast.success("Enlace de recuperación enviado");
  }

  return <main className="login-screen login-approved"><Toaster position="top-center" richColors/>
    <section className="login-approved-shell">
      <div className="login-approved-hero" aria-hidden="true"/>
      <div className="login-approved-brand"><Image src="/scancontrol-brand-dark.svg" alt="Grupo Canaima ScanControl" width={760} height={210} priority/></div>

      <div className="login-approved-copy">
        <h1>Bienvenido</h1>
        <span className="login-approved-accent"/>
        <div className="login-approved-secure"><strong>Acceso protegido</strong><ShieldCheck size={17}/></div>
        <p>Ingresa con tus credenciales para continuar.</p>
      </div>

      <form onSubmit={submit} className="login-approved-form">
        <label className="login-approved-field">
          <span><Mail size={20}/><b>Correo electrónico</b></span>
          <Input value={email} onChange={(event)=>setEmail(event.target.value)} required type="email" placeholder="ejemplo@empresa.com" autoComplete="email"/>
        </label>
        <label className="login-approved-field">
          <span><LockKeyhole size={20}/><b>Contraseña</b></span>
          <div className="login-approved-password">
            <Input value={password} onChange={(event)=>setPassword(event.target.value)} required type={showPassword?"text":"password"} minLength={8} placeholder="Ingresa tu contraseña" autoComplete="current-password"/>
            <button type="button" aria-label={showPassword?"Ocultar contraseña":"Mostrar contraseña"} onClick={()=>setShowPassword((value)=>!value)}>{showPassword?<EyeOff size={20}/>:<Eye size={20}/>}</button>
          </div>
        </label>
        <div className="login-approved-options">
          <label className="login-approved-remember"><input type="checkbox" checked={remember} onChange={(event)=>setRemember(event.target.checked)}/><span>Recordarme en este dispositivo</span></label>
          <button type="button" onClick={()=>void recoverPassword()}>¿Olvidaste tu contraseña?</button>
        </div>
        <Button className="login-approved-submit" type="submit" disabled={busy}>{busy?<><LoaderCircle className="spin" size={18}/> Iniciando…</>:<><LogOut size={19}/> Iniciar sesión</>}</Button>
        {formMessage && <p className={`auth-message auth-message-${formMessage.kind}`} role={formMessage.kind === "error" ? "alert" : "status"}>{formMessage.text}</p>}
      </form>

      <div className="login-approved-protected"><span className="login-approved-shield"><ShieldCheck size={23}/></span><p><strong>Tus datos están protegidos</strong><span>Usamos cifrado y buenas prácticas<br/>de seguridad empresarial.</span></p></div>
      <footer className="login-approved-footer"><div><Store size={17}/><span>GRUPO CANAIMA · OPERACIONES</span></div><small>Versión 2.0.0</small></footer>
    </section>
  </main>;
}

export default function Home() {'''
          pattern=r'function LoginScreen\(\) \{.*?\n\}\n\nexport default function Home\(\) \{'
          ns,n=re.subn(pattern,new_login,s,flags=re.S)
          if n!=1:
            raise SystemExit(f'Expected one LoginScreen block, replaced {n}')
          p.write_text(ns)
          PY

          cat >> app/visual-refresh.css <<'CSS'

