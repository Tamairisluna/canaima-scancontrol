name: Apply main camera 1x fix

on:
  push:
    paths:
      - ".github/workflows/apply-main-camera-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use the device main rear camera at native 1x
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()

          start = text.index('function cameraDeviceScore')
          end = text.index('async function optimizeCamera')
          camera_helpers = '''function cameraConstraints(exactEnvironment = true): MediaStreamConstraints {
            return {
              audio: false,
              video: {
                facingMode: exactEnvironment ? { exact: "environment" } : { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 30, min: 20 },
              },
            };
          }

          async function openMainRearCamera() {
            try {
              // Let the browser/OS choose its default rear camera. On multi-lens phones this is
              // the same camera family the native camera app exposes as the normal 1× view.
              return await navigator.mediaDevices.getUserMedia(cameraConstraints(true));
            } catch (error) {
              const recoverable = error instanceof DOMException && ["OverconstrainedError", "NotFoundError", "ConstraintNotSatisfiedError"].includes(error.name);
              if (!recoverable) throw error;
              return navigator.mediaDevices.getUserMedia(cameraConstraints(false));
            }
          }

          '''
          text = text[:start] + camera_helpers + text[end:]

          old_opt = '''async function optimizeCamera(stream: MediaStream) {
            const track = stream.getVideoTracks()[0];
            if (!track) return { focus: false, zoom: false };
            const capabilities = track.getCapabilities?.() as ExtendedCameraCapabilities | undefined;
            const advanced: ExtendedCameraConstraintSet = {};
            if (capabilities?.focusMode?.includes("continuous")) advanced.focusMode = "continuous";
            if (capabilities?.zoom && capabilities.zoom.min <= 1 && capabilities.zoom.max >= 1) advanced.zoom = 1;
            if (Object.keys(advanced).length) {
              try { await track.applyConstraints({ advanced: [advanced] }); } catch { /* El enfoque automático del dispositivo sigue disponible. */ }
            }
            return { focus: Boolean(advanced.focusMode), zoom: advanced.zoom === 1 };
          }
          '''
          new_opt = '''async function optimizeCamera(stream: MediaStream) {
            const track = stream.getVideoTracks()[0];
            if (!track) return { focus: false, zoom: false };
            const capabilities = track.getCapabilities?.() as ExtendedCameraCapabilities | undefined;
            const advanced: ExtendedCameraConstraintSet = {};
            if (capabilities?.focusMode?.includes("continuous")) advanced.focusMode = "continuous";
            // Keep the phone at its true 1× view. If the browser exposes a logical multi-lens
            // rear camera (for example 0.5×–10×), asking for zoom 1 selects the normal lens.
            if (capabilities?.zoom && capabilities.zoom.min <= 1 && capabilities.zoom.max >= 1) advanced.zoom = 1;
            try {
              await track.applyConstraints({
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 30 },
                ...(Object.keys(advanced).length ? { advanced: [advanced] } : {}),
              });
            } catch { /* Conserva el autofocus y la resolución que entregue el dispositivo. */ }
            return { focus: Boolean(advanced.focusMode), zoom: advanced.zoom === 1 };
          }
          '''
          if old_opt not in text:
              raise SystemExit('optimizeCamera block not found')
          text = text.replace(old_opt, new_opt, 1)

          old_stream = '''      let devices=await navigator.mediaDevices.enumerateDevices();
                let preferredCamera=selectMainRearCamera(devices);
                let stream=await navigator.mediaDevices.getUserMedia(cameraConstraints(preferredCamera?.deviceId));
          
                if(!preferredCamera){
                  devices=await navigator.mediaDevices.enumerateDevices();
                  preferredCamera=selectMainRearCamera(devices);
                  const currentDeviceId=stream.getVideoTracks()[0]?.getSettings().deviceId;
                  if(preferredCamera?.deviceId&&preferredCamera.deviceId!==currentDeviceId){
                    stream.getTracks().forEach((track)=>track.stop());
                    stream=await navigator.mediaDevices.getUserMedia(cameraConstraints(preferredCamera.deviceId));
                  }
                }
          '''
          if old_stream not in text:
              # The source is compacted with different indentation; use index boundaries instead.
              start2 = text.index('      let devices=await navigator.mediaDevices.enumerateDevices();')
              end2 = text.index('      if(cameraSession!==cameraSessionRef.current)', start2)
              text = text[:start2] + '      let stream=await openMainRearCamera();\n\n' + text[end2:]
          else:
              text = text.replace(old_stream, '      let stream=await openMainRearCamera();\n\n', 1)

          text = text.replace('setCameraStatus(optimization.focus?"Cámara principal 1× · enfoque continuo":"Cámara trasera principal 1×");', 'setCameraStatus(optimization.focus?"Cámara trasera principal 1× · enfoque continuo":"Cámara trasera principal 1× · autofocus del dispositivo");', 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Commit verified camera fix
        shell: bash
        run: |
          git config user.name "Tamairisluna"
          git config user.email "tamairislunadiaz893@gmail.com"
          git rm .github/workflows/apply-main-camera-fix.yml
          git add app/page.tsx package-lock.json
          git commit -m "Corrige selección de cámara principal 1x y enfoque"
          git push origin main
