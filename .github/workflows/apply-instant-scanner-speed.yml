name: Apply instant scanner speed

on:
  push:
    paths:
      - ".github/workflows/apply-instant-scanner-speed.yml"

permissions:
  contents: write

jobs:
  patch-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make continuous scanning near-instant
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          old_reader = '      const reader=new BrowserMultiFormatOneDReader(undefined,{delayBetweenScanAttempts:60,delayBetweenScanSuccess:120});'
          new_reader = '      const reader=new BrowserMultiFormatOneDReader(undefined,{delayBetweenScanAttempts:20,delayBetweenScanSuccess:40});'
          if text.count(old_reader) != 1:
              raise SystemExit(f"Expected one reader timing block, found {text.count(old_reader)}")
          text = text.replace(old_reader, new_reader, 1)

          old_callback = '''      controlsRef.current=await reader.decodeFromStream(stream,videoElement,(result)=>{\n        if(!result)return;\n        const scanned=normalizeBarcode(result.getText()),now=Date.now();\n        if(!scanned||(scanned===lastScanRef.current.code&&now-lastScanRef.current.at<5000))return;\n        lastScanRef.current={code:scanned,at:now};\n        void registerCode(scanned,evaluation);\n      });'''
          new_callback = '''      controlsRef.current=await reader.decodeFromStream(stream,videoElement,(result)=>{\n        const now=Date.now();\n        if(!result){\n          // As soon as the previous barcode leaves the frame, let that same code be read again.\n          // Different barcodes are never blocked by this gate.\n          if(lastScanRef.current.code&&now-lastScanRef.current.at>450)lastScanRef.current={code:\"\",at:0};\n          return;\n        }\n        const scanned=normalizeBarcode(result.getText());\n        if(!scanned)return;\n        const sameCodeStillVisible=scanned===lastScanRef.current.code&&now-lastScanRef.current.at<900;\n        lastScanRef.current={code:scanned,at:now};\n        if(sameCodeStillVisible)return;\n        void registerCode(scanned,evaluation);\n      });'''
          if text.count(old_callback) != 1:
              raise SystemExit(f"Expected one scanner callback, found {text.count(old_callback)}")
          text = text.replace(old_callback, new_callback, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Commit verified speed fix
        shell: bash
        run: |
          git config user.name "Tamairisluna"
          git config user.email "tamairislunadiaz893@gmail.com"
          git rm .github/workflows/apply-instant-scanner-speed.yml
          git add app/page.tsx package-lock.json
          git commit -m "Acelera escaneo continuo y reduce espera entre productos"
          git push origin main
